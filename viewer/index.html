<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#14181f;--muted:#5b6472;--line:#dde1e7;--soft:#eef1f5;
  --close:#1f5fbf;--close-bg:#e6efff;--rfi:#a35a00;--rfi-bg:#fff2dc;--esc:#6b2fb3;--esc-bg:#f1e8ff;
  --hot:#0b7a5a;--edge:#b9c1cc;--edge-hot:#14181f;--focus:#ffb000;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1217;--panel:#171b22;--ink:#e8ecf1;--muted:#9aa4b2;--line:#2a313c;--soft:#1e242d;
  --close:#7fb0ff;--close-bg:#16263f;--rfi:#ffbe5c;--rfi-bg:#33260f;--esc:#c9a2ff;--esc-bg:#2a1d3d;
  --hot:#4fd1a5;--edge:#3a4350;--edge-hot:#e8ecf1;
}}
:root[data-theme="dark"]{
  --bg:#0f1217;--panel:#171b22;--ink:#e8ecf1;--muted:#9aa4b2;--line:#2a313c;--soft:#1e242d;
  --close:#7fb0ff;--close-bg:#16263f;--rfi:#ffbe5c;--rfi-bg:#33260f;--esc:#c9a2ff;--esc-bg:#2a1d3d;
  --hot:#4fd1a5;--edge:#3a4350;--edge-hot:#e8ecf1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:.2px}
header .tag{color:var(--muted);font-size:13px}
header .spacer{flex:1}
button,select,input{font:inherit;color:inherit}
#theme{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.bar span{display:block}
.stat small{color:var(--muted)}
main{display:grid;grid-template-columns:360px 1fr;gap:14px;padding:0 20px 20px;min-height:0}
.queue{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.filters input{grid-column:1/-1}
.filters input,.filters select{padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.list{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--soft);cursor:pointer;width:100%;text-align:left;background:none;border-left:3px solid transparent}
.row[aria-selected="true"]{background:var(--soft);border-left-color:var(--ink)}
.row .n{font-weight:600}
.row .m{grid-column:2;color:var(--muted);font-size:12.5px}
.count{padding:8px 12px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.CLOSE{color:var(--close);background:var(--close-bg)}.RFI{color:var(--rfi);background:var(--rfi-bg)}.ESCALATE{color:var(--esc);background:var(--esc-bg)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.dh{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.dh h2{margin:0;font-size:20px}
.meta{color:var(--muted);font-size:13px;margin:4px 0 10px}
.reason{font-size:16px;background:var(--soft);border-radius:8px;padding:10px 12px;margin:8px 0 14px}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:0;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.graphwrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
svg{display:block}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.2;rx:8}
.node.hot rect{stroke:var(--hot);stroke-width:2}
.node.v-CLOSE rect{fill:var(--close-bg);stroke:var(--close)}.node.v-RFI rect{fill:var(--rfi-bg);stroke:var(--rfi)}.node.v-ESCALATE rect{fill:var(--esc-bg);stroke:var(--esc)}
.node text{fill:var(--ink);font-size:12px}.node text.sub{fill:var(--muted);font-size:10.5px}
.node{cursor:pointer}.node:focus{outline:none}.node:focus rect,.node.sel rect{stroke:var(--focus);stroke-width:3}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge.lit{stroke:var(--edge-hot);stroke-width:2.4}
.dim{opacity:.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.box h3{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12.5px/1.5 ui-monospace,Consolas,monospace;max-height:320px;overflow:auto}
ol.path{margin:0;padding-left:18px}ol.path li{margin:3px 0}
.legend{color:var(--muted);font-size:12px;margin-top:6px}
.empty{color:var(--muted);padding:40px;text-align:center}
@media (max-width:900px){main{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.queue{max-height:50vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Trail</h1>
  <span class="tag">Rules gather evidence, the firm's policy decides, every link has a source.</span>
  <span class="spacer"></span>
  <button id="theme" type="button" aria-label="Toggle colour theme">Theme</button>
</header>
<section class="stats" id="stats" aria-label="Verdicts per institution"></section>
<main>
  <section class="queue" aria-label="Alert queue">
    <div class="filters">
      <input id="q" type="search" placeholder="Search case, customer, code…" aria-label="Search cases">
      <select id="fi" aria-label="Institution"><option value="">All institutions</option><option>bank</option><option>emoney</option><option>investment</option><option>payments_fx</option></select>
      <select id="fv" aria-label="Verdict"><option value="">All verdicts</option><option>CLOSE</option><option>RFI</option><option>ESCALATE</option></select>
      <select id="fr" aria-label="Rule" style="grid-column:1/-1"><option value="">All rules</option></select>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Cases" tabindex="0"></div>
    <div class="count" id="count"></div>
  </section>
  <section class="detail" id="detail" aria-live="polite"><div class="empty">Loading… (build data with <code>python viewer/build.py &lt;institutions&gt; output</code>)</div></section>
</main>
<script src="data.js"></script>
<script>
(function(){
const D = window.CT_DATA || [];
const ICON = {CLOSE:"✓",RFI:"?",ESCALATE:"⚠"};
const WORD = {CLOSE:"Close",RFI:"Ask customer (RFI)",ESCALATE:"Escalate to MLRO"};
const COLS = ["What fired","Money moved","Who is involved","Documents on file","Decision"];
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge = v => `<span class="badge ${v}"><span aria-hidden="true">${ICON[v]}</span>${WORD[v]}</span>`;
try{const t=localStorage.getItem("trail-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
$("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("trail-theme",n)}catch(e){}};

// stats
const insts=["bank","emoney","investment","payments_fx"];
$("#stats").innerHTML = insts.map(i=>{
  const rs=D.filter(c=>c.inst===i), n=rs.length||1, k={CLOSE:0,RFI:0,ESCALATE:0};
  rs.forEach(c=>k[c.verdict]++);
  return `<div class="stat"><b>${i.replace("_"," / ")}</b>
   <div class="bar" role="img" aria-label="${k.CLOSE} close, ${k.RFI} RFI, ${k.ESCALATE} escalate">
   <span style="width:${k.CLOSE/n*100}%;background:var(--close)"></span><span style="width:${k.RFI/n*100}%;background:var(--rfi)"></span><span style="width:${k.ESCALATE/n*100}%;background:var(--esc)"></span></div>
   <small>✓ ${k.CLOSE} close · ? ${k.RFI} RFI · ⚠ ${k.ESCALATE} escalate · ${rs.length} cases</small></div>`;}).join("");
const rules=[...new Set(D.flatMap(c=>c.rules))].sort();
$("#fr").innerHTML+=rules.map(r=>`<option>${r}</option>`).join("");

let shown=[], cur=null;
function filter(){
  const q=$("#q").value.toLowerCase(), fi=$("#fi").value, fv=$("#fv").value, fr=$("#fr").value;
  shown=D.filter(c=>(!fi||c.inst===fi)&&(!fv||c.verdict===fv)&&(!fr||c.rules.includes(fr))&&
    (!q||(c.case_id+" "+c.customer+" "+c.code+" "+c.reason).toLowerCase().includes(q)));
  const lim=shown.slice(0,400);
  $("#list").innerHTML=lim.map((c,i)=>`<button class="row" role="option" data-i="${i}" aria-selected="${cur&&cur.case_id===c.case_id}">
    ${badge(c.verdict)}<span class="n">${esc(c.customer)}</span><span class="m">${c.case_id} · ${c.rules.join(" ")} · ${c.code}</span></button>`).join("");
  $("#count").textContent=`${shown.length} cases${shown.length>400?" (first 400 shown, refine the search)":""} · j/k to move, Enter to open`;
  [...document.querySelectorAll(".row")].forEach(b=>b.onclick=()=>open(shown[+b.dataset.i]));
}
["#q","#fi","#fv","#fr"].forEach(s=>$(s).addEventListener("input",filter));

function open(c){
  cur=c; filter();
  const W=1100, colW=W/5, nw=colW-28, nh=50, gap=12;
  const byCol=[[],[],[],[],[]]; c.nodes.forEach(n=>byCol[n.col].push(n));
  const H=Math.max(...byCol.map(a=>a.length))*(nh+gap)+30;
  const pos={};
  byCol.forEach((arr,ci)=>{const top=(H-arr.length*(nh+gap))/2; arr.forEach((n,j)=>pos[n.id]={x:ci*colW+14,y:top+j*(nh+gap)});});
  const edges=c.edges.filter(e=>pos[e[0]]&&pos[e[1]]);
  const path=e=>{const a=pos[e[0]],b=pos[e[1]];const x1=a.x+nw,y1=a.y+nh/2,x2=b.x,y2=b.y+nh/2;const mx=(x1+x2)/2;
    return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;};
  const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Evidence graph; the text path below lists the same links">
   ${edges.map((e,i)=>`<path class="edge" data-a="${esc(e[0])}" data-b="${esc(e[1])}" d="${path(e)}"><title>${esc(e[2])} (source ${esc(e[3])})</title></path>`).join("")}
   ${c.nodes.map(n=>`<g class="node ${n.hot?"hot":""} ${n.kind==="verdict"?"v-"+c.verdict:""}" tabindex="0" data-id="${esc(n.id)}" transform="translate(${pos[n.id].x},${pos[n.id].y})" role="button" aria-label="${esc(n.label)}">
     <rect width="${nw}" height="${nh}"></rect>
     <text x="10" y="20">${esc(trunc(n.kind==="verdict"?ICON[c.verdict]+" "+n.label:n.label,30))}</text>
     <text class="sub" x="10" y="37">${esc(trunc(n.sub||n.id,36))}</text></g>`).join("")}</svg>`;
  const pathItems=edges.map(e=>`<li><b>${esc(label(c,e[0]))}</b> — ${esc(e[2])} → <b>${esc(label(c,e[1]))}</b> <small>(source ${esc(e[3])})</small></li>`).join("");
  $("#detail").innerHTML=`
   <div class="dh"><h2>${esc(c.customer)}</h2>${badge(c.verdict)}<span class="badge" style="background:var(--soft)">${c.code}</span></div>
   <div class="meta">${c.case_id} · ${c.inst.replace("_"," / ")} · ${c.kind||""} · window ${c.window?c.window.from+" to "+c.window.to:""}${c.held?" · held payment "+c.held:""} · rules ${c.rules.join(", ")}</div>
   <div class="reason">${esc(c.reason)}</div>
   <div class="cols" style="min-width:${W}px">${COLS.map(x=>`<span style="padding-left:14px">${x}</span>`).join("")}</div>
   <div class="graphwrap">${svg}</div>
   <div class="legend">Green outline = cited as evidence. Hover a box to trace its links; click or press Enter to read its source.</div>
   <div class="two">
     <div class="box"><h3>Source</h3><pre id="src">Click any box in the graph to read the document, transaction or list entry behind it.</pre></div>
     <div class="box"><h3>Text path (${edges.length} links)</h3><ol class="path">${pathItems}</ol></div>
   </div>`;
  document.querySelectorAll(".node").forEach(g=>{
    const id=g.dataset.id;
    const lit=on=>{document.querySelectorAll(".edge").forEach(p=>{const hit=p.dataset.a===id||p.dataset.b===id;p.classList.toggle("lit",on&&hit);p.classList.toggle("dim",on&&!hit);});};
    g.onmouseenter=()=>lit(true); g.onmouseleave=()=>lit(false); g.onfocus=()=>lit(true); g.onblur=()=>lit(false);
    const show=()=>{document.querySelectorAll(".node").forEach(x=>x.classList.remove("sel"));g.classList.add("sel");
      const n=c.nodes.find(x=>x.id===id); $("#src").textContent=n&&n.src?`${n.src.id}\n\n${n.src.text}`:id;};
    g.onclick=show; g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show();}};
  });
}
function label(c,id){const n=c.nodes.find(x=>x.id===id);return n?(n.kind==="verdict"?c.verdict+" "+c.code:n.label):id;}
document.addEventListener("keydown",e=>{
  if(["INPUT","SELECT"].includes(document.activeElement.tagName))return;
  if(!shown.length)return; const i=cur?shown.indexOf(cur):-1;
  if(e.key==="j"){open(shown[Math.min(i+1,shown.length-1)]);}
  if(e.key==="k"){open(shown[Math.max(i-1,0)]);}
});
filter();
if(D.length){const pick=D.find(c=>c.code==="ESC_LISTED_PARTY")||D[0]; open(pick);}
else $("#detail").innerHTML='<div class="empty">No data yet. Run <code>python viewer/build.py &lt;institutions folder&gt; output</code>.</div>';
})();
</script>
</body>
</html>
